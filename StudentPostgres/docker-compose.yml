version: "3.8"

services:
  app:
    build: .
    image: studentpostgres-app:1.0
    container_name: student-app
    ports:
      - "8079:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/RatingMicroService
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
    depends_on:
      - db

  db:
    image: postgres:12.11
    container_name: postgres-db
    environment:
      POSTGRES_DB: RatingMicroService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
